# VoidGate configuration
# Silent unless this VM's NIC is under DDoS. Control plane decides drops;
# XDP enforces a prefix-tree drop list.

interface = eth0
xdp_mode = auto

# IDLE watchdog (aggregate NIC / coarse XDP counters)
wake_pps = 20000
wake_mbps = 1000
idle_poll_ms = 1000
clear_seconds = 30

# ACTIVE policy
threshold_pps = 20000
threshold_mbps = 1000
ban_time = 1900
aggregate_k = 8

# Empty local_networks = auto-detect from the interface
local_networks =
# Non-empty allow_networks replaces the built-in list (metadata,
# localhost, link-local).
allow_networks = 169.254.169.254/32, 127.0.0.0/8, ::1/128, fe80::/10, ff02::/16
allow_ports = 22

remote_map_size = 262144
drop_map_size = 65536
metrics_port = 9105
